<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Memory Grid 3x6</title>
<style>
  body{font-family:sans-serif;text-align:center;background:#121212;color:#fff;padding:10px;margin:0}
  h3{margin:15px 0 5px;font-size:18px}
  p{color:#aaa;font-size:13px;margin-bottom:15px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
  .card-slot{background:#1e1e1e;border:2px dashed #444;height:95px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#777;overflow:hidden}
  .card-slot img{width:100%;height:100%;object-fit:cover;border-radius:6px}
  .btn-reset{margin-top:20px;padding:12px 25px;background:#ff4d4d;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:bold}

  #camView{position:fixed;inset:0;background:#000;display:none;z-index:10;flex-direction:column}
  #video{flex:1;width:100%;min-height:0;object-fit:cover}
  #frame{position:absolute;left:50%;top:45%;width:75vmin;height:75vmin;transform:translate(-50%,-50%);
    border:3px solid #0f0;border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.6);pointer-events:none}
  #frame::before,#frame::after{content:"";position:absolute;background:rgba(0,255,0,.5)}
  #frame::before{left:33.3%;right:33.3%;top:0;bottom:0;background:none;border-left:1px solid rgba(0,255,0,.5);border-right:1px solid rgba(0,255,0,.5)}
  #frame::after{top:33.3%;bottom:33.3%;left:0;right:0;background:none;border-top:1px solid rgba(0,255,0,.5);border-bottom:1px solid rgba(0,255,0,.5)}
  .bar{display:flex;justify-content:space-around;align-items:center;padding:20px;background:#000}
  #shot{width:70px;height:70px;border-radius:50%;border:4px solid #888;background:#fff}
  #cancel{background:none;border:none;color:#fff;font-size:16px}
</style>
</head>
<body>
<h3>🎯 ตารางจำไพ่ (กรอบเล็ง)</h3>
<p>จิ้มช่อง ➔ วางไพ่/ไอแพดในกรอบเขียว ➔ กดถ่าย</p>
<div class="grid" id="gridContainer"></div>
<button class="btn-reset" onclick="resetGrid()">รีเซ็ตตารางใหม่</button>

<div id="camView">
  <video id="video" playsinline muted autoplay></video>
  <div id="frame"></div>
  <div class="bar"><button id="cancel">ยกเลิก</button><button id="shot"></button><span style="width:50px"></span></div>
</div>
<canvas id="cropCanvas" style="display:none"></canvas>

<script>
const grid=document.getElementById('gridContainer');
const camView=document.getElementById('camView');
const video=document.getElementById('video');
const frame=document.getElementById('frame');
const canvas=document.getElementById('cropCanvas');
const ctx=canvas.getContext('2d');
let stream=null, activeSlot=null;

for(let i=1;i<=18;i++){
  const s=document.createElement('div');
  s.className='card-slot';
  s.textContent='ช่อง '+i;
  s.onclick=()=>openCam(s);
  grid.appendChild(s);
}

async function openCam(slot){
  activeSlot=slot;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream;
    camView.style.display='flex';
  }catch(e){
    alert('เปิดกล้องไม่ได้: '+e.message+'\n(ต้องเปิดผ่าน https หรือ localhost และอนุญาตกล้อง)');
  }
}
function closeCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  camView.style.display='none';
}
document.getElementById('cancel').onclick=closeCam;

document.getElementById('shot').onclick=()=>{
  const vr=video.getBoundingClientRect(), fr=frame.getBoundingClientRect();
  const vw=video.videoWidth, vh=video.videoHeight;
  // คำนวณสเกลของ object-fit:cover
  const scale=Math.max(vr.width/vw, vr.height/vh);
  const offX=(vw*scale-vr.width)/2, offY=(vh*scale-vr.height)/2;
  const sx=(fr.left-vr.left+offX)/scale;
  const sy=(fr.top-vr.top+offY)/scale;
  const sw=fr.width/scale, sh=fr.height/scale;

  canvas.width=300; canvas.height=300;
  ctx.drawImage(video,sx,sy,sw,sh,0,0,300,300);
  activeSlot.innerHTML=`<img src="${canvas.toDataURL('image/jpeg',0.8)}" alt="Card">`;
  closeCam();
};

function resetGrid(){ if(confirm("ล้างตารางทั้งหมด?")) location.reload(); }
</script>
</body>
</html>
