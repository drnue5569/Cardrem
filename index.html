<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Memory Grid 3x6 (Crop View)</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #121212;
            color: #fff;
            padding: 10px;
            margin: 0;
        }
        h3 { margin: 15px 0 5px 0; font-size: 18px; }
        p { color: #aaa; font-size: 13px; margin-bottom: 15px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 420px;
            margin: 0 auto;
        }
        .card-slot {
            background: #1e1e1e;
            border: 2px dashed #444;
            height: 95px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            color: #777;
            position: relative;
            overflow: hidden;
        }
        .card-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }
        input[type="file"] {
            display: none;
        }
        .btn-reset {
            margin-top: 20px;
            padding: 12px 25px;
            background: #ff4d4d;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-reset:active { background: #cc0000; }
    </style>
</head>
<body>

    <h3>🎯 ตารางจำไพ่ (ระบบกรอบเล็งด่วน)</h3>
    <p>จิ้มช่อง ➔ เอาไอแพดไว้ในกรอบ ➔ ถ่ายรูปตัดเฉพาะส่วนอัตโนมัติ</p>

    <div class="grid" id="gridContainer"></div>

    <button class="btn-reset" onclick="resetGrid()">รีเซ็ตตารางใหม่</button>

    <!-- Canvas สำหรับประมวลผลตัดภาพ (ซ่อนไว้ไม่ให้เกะกะสายตา) -->
    <canvas id="cropCanvas" style="display:none;"></canvas>

    <script>
        const gridContainer = document.getElementById('gridContainer');
        const totalSlots = 18; // 3 แถว x 6 หลัก
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');

        for (let i = 1; i <= totalSlots; i++) {
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            slot.id = `slot-${i}`;
            slot.innerHTML = `ช่อง ${i}`;
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment'; // เปิดกล้องหลัง
            
            slot.onclick = () => input.click();
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            // คำนวณตัดเฉพาะตรงกลางภาพ (Crop ตรงกลาง เพื่อให้ได้ไพ่เน้นๆ ไม่หลุดโฟกัส)
                            const size = Math.min(img.width, img.height); // เอาสัดส่วนสี่เหลี่ยมจัตุรัส
                            const startX = (img.width - size) / 2;
                            const startY = (img.height - size) / 2;

                            canvas.width = 300;
                            canvas.height = 300;

                            // วาดภาพลง Canvas แล้วตัดเฉพาะส่วนตรงกลาง
                            ctx.drawImage(img, startX, startY, size, size, 0, 0, 300, 300);

                            // แปลงภาพที่ตัดแล้วมาแปะใส่ช่อง Grid
                            const croppedImageUrl = canvas.toDataURL('image/jpeg', 0.8);
                            slot.innerHTML = `<img src="${croppedImageUrl}" alt="Card">`;
                        }
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            };

            slot.appendChild(input);
            gridContainer.appendChild(slot);
        }

        function resetGrid() {
            if (confirm("ล้างตารางทั้งหมด?")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
