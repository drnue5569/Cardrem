<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Memory Grid (Auto-Queue Mode)</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #121212;
            color: #fff;
            padding: 10px;
            margin: 0;
            padding-bottom: 50px;
        }
        h3 { margin: 10px 0 5px 0; font-size: 16px; }
        p { color: #aaa; font-size: 12px; margin-bottom: 15px; }
        
        /* ปุ่มถ่ายรูปหลักและสถานะคิว */
        .control-panel {
            background: #1e1e1e;
            border: 2px solid #4cd137;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .btn-shoot {
            background: #4cd137;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn-shoot:active { background: #38ada9; }
        .status-text {
            margin-top: 10px;
            font-size: 15px;
            color: #fbc531;
            font-weight: bold;
        }

        /* ตาราง Grid หลัก 3x6 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 420px;
            margin: 0 auto;
        }
        .card-slot {
            background: #1e1e1e;
            border: 2px dashed #444;
            height: 95px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #777;
            position: relative;
            overflow: hidden;
        }
        .card-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }
        .slot-number {
            position: absolute;
            top: 4px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 4px;
            z-index: 2;
        }
        input[type="file"] { display: none; }

        .btn-reset {
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff4d4d;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h3>🚀 โหมดออโต้คิว (ถ่ายปุ๊บ ลงช่องถัดไปอัตโนมัติ)</h3>

    <!-- แผงควบคุมการถ่าย -->
    <div class="control-panel">
        <button class="btn-shoot" onclick="triggerCapture()">📸 ถ่ายรูป (กำลังลงช่องที่ <span id="currentSlotNum">1</span>)</button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
        <div class="status-text" id="statusMsg">พร้อมถ่ายรูปที่ 1 จาก 18</div>
    </div>

    <!-- ตาราง Grid 3x6 -->
    <div class="grid" id="gridContainer"></div>

    <button class="btn-reset" onclick="resetGrid()">รีเซ็ตตารางใหม่ทั้งหมด</button>
    <canvas id="cropCanvas" style="display:none;"></canvas>

    <script>
        const gridContainer = document.getElementById('gridContainer');
        const currentSlotNumEl = document.getElementById('currentSlotNum');
        const statusMsg = document.getElementById('statusMsg');
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentIndex = 1; // เริ่มที่ช่องที่ 1
        const totalSlots = 18;
        const slots = {};

        // 1. สร้างช่อง Grid 18 ช่องพร้อมป้ายบอกเลขช่อง
        for (let i = 1; i <= totalSlots; i++) {
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            slot.id = `slot-${i}`;
            
            const badge = document.createElement('div');
            badge.className = 'slot-number';
            badge.innerText = `ช่อง ${i}`;
            
            slot.appendChild(badge);
            slot.append(`รอรูป...`);
            
            gridContainer.appendChild(slot);
            slots[i] = slot;
        }

        // 2. ฟังก์ชันกดปุ่มถ่าย
        function triggerCapture() {
            if (currentIndex > totalSlots) {
                alert("ถ่ายครบ 18 ช่องแล้วครับ เต็มความจุพอดี!");
                return;
            }
            document.getElementById('cameraInput').click();
        }

        // 3. พถ่ายรูปเสร็จ เอาภาพแปะลงช่องตามลำดับ currentIndex ทันที
        document.getElementById('cameraInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file && currentIndex <= totalSlots) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // ตัด Crop ตรงกลางอัตโนมัติ
                        const size = Math.min(img.width, img.height);
                        const startX = (img.width - size) / 2;
                        const startY = (img.height - size) / 2;

                        canvas.width = 300;
                        canvas.height = 300;
                        ctx.drawImage(img, startX, startY, size, size, 0, 0, 300, 300);
                        const croppedUrl = canvas.toDataURL('image/jpeg', 0.8);

                        // เอาภาพไปแปะในช่องปัจจุบัน
                        const slot = slots[currentIndex];
                        slot.innerHTML = `
                            <div class="slot-number">ช่อง ${currentIndex}</div>
                            <img src="${croppedUrl}" alt="Card ${currentIndex}">
                        `;

                        // ขยับไปช่องถัดไป
                        currentIndex++;
                        
                        if (currentIndex <= totalSlots) {
                            currentSlotNumEl.innerText = currentIndex;
                            statusMsg.innerText = `กำลังจะลงรูปที่ ${currentIndex} จาก 18`;
                        } else {
                            statusMsg.innerText = "🎉 ครบ 18 ช่องเรียบร้อย สมบูรณ์แบบ!";
                            document.querySelector('.btn-shoot').style.background = '#888';
                            document.querySelector('.btn-shoot').innerText = "ถ่ายครบแล้ว!";
                        }

                        // เคลียร์ค่า input ให้พร้อมกดถ่ายรอบถัดไปทันที
                        e.target.value = '';
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        };

        function resetGrid() {
            if (confirm("ต้องการรีเซ็ตใหม่ทั้งหมดใช่ไหม?")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
